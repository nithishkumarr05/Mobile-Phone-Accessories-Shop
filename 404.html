<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>404 · Page Not Found | PhoneHub</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='75' font-size='75' text-anchor='middle'%3E📱%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'phone-primary': '#0F0E17',
                        'phone-secondary': '#1A1A2E',
                        'phone-accent': '#FF6B6B',
                        'phone-accent2': '#FFD93D',
                        'phone-accent3': '#6BCB77',
                        'phone-purple': '#6C3CE1',
                        'phone-light': '#F5F5F5',
                        'phone-dark': '#0D0D1A',
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            background: linear-gradient(135deg, #0F0E17 0%, #1A1A2E 50%, #0F0E17 100%);
            color: #E8EDEE;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Inter', sans-serif;
            padding: 16px;
        }

        .dark body {
            background: linear-gradient(135deg, #0A0A0A 0%, #0F0E17 50%, #0A0A0A 100%);
        }

        /* Background Decoration */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 107, 107, 0.06) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(255, 217, 61, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .floating-icon {
            position: fixed;
            opacity: 0.04;
            pointer-events: none;
            z-index: 0;
            font-size: 80px;
        }
        .floating-icon:nth-child(1) { top: 10%; left: 5%; animation: float 8s ease-in-out infinite; }
        .floating-icon:nth-child(2) { bottom: 15%; right: 5%; animation: float 10s ease-in-out infinite 2s; }
        .floating-icon:nth-child(3) { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 150px; opacity: 0.03; animation: float 12s ease-in-out infinite 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Theme Toggle - Top Right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }
        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 16px;
        }
        .toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.8);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.9rem;
            backdrop-filter: blur(8px);
        }
        .toggle-btn:hover {
            background: #FF6B6B;
            color: #0F0E17;
            border-color: #FF6B6B;
            transform: scale(1.05);
        }
        .dark .toggle-btn {
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.6);
        }

        /* 404 Card */
        .error-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            text-align: center;
        }
        .dark .error-card {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.04);
        }

        /* Logo */
        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            margin-bottom: 0.5rem;
        }
        .logo-icon {
            background: linear-gradient(135deg, #FF6B6B, #FFD93D);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            flex-shrink: 0;
        }
        .logo-icon i { color: #0F0E17; font-size: 1.3rem; }
        .logo-text { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; color: #ffffff; line-height: 1.1; }
        .logo-text .highlight { color: #FF6B6B; }
        .logo-sub { font-size: 0.45rem; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255, 255, 255, 0.5); font-weight: 600; display: block; margin-top: -2px; text-align: center; }

        /* 404 Number */
        .error-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(80px, 18vh, 140px);
            font-weight: 900;
            background: linear-gradient(135deg, #FF6B6B 0%, #FFD93D 70%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
            letter-spacing: -4px;
            animation: pulseGlow 3s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 107, 107, 0.2); }
            50% { text-shadow: 0 0 40px rgba(255, 107, 107, 0.5), 0 0 80px rgba(255, 217, 61, 0.2); }
        }

        .error-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.2rem, 3.5vh, 2rem);
            font-weight: 700;
            color: #ffffff;
            margin-bottom: clamp(4px, 1vh, 12px);
        }
        .dark .error-title { color: #E8EDEE; }

        .error-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: clamp(0.75rem, 2vh, 0.95rem);
            line-height: 1.6;
            max-width: 380px;
            margin: 0 auto;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #FF6B6B, #FFD93D);
            color: #0F0E17;
            padding: clamp(0.5rem, 1.2vh, 0.8rem) clamp(1.2rem, 2.5vw, 2rem);
            border-radius: 60px;
            font-weight: 700;
            font-size: clamp(0.7rem, 1.8vh, 0.85rem);
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            border: none;
            cursor: pointer;
            text-decoration: none;
            flex-shrink: 0;
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 30px rgba(255, 107, 107, 0.4);
        }

        .btn-outline {
            border: 2px solid #FF6B6B;
            background: transparent;
            color: #FF6B6B;
            padding: clamp(0.5rem, 1.2vh, 0.8rem) clamp(1.2rem, 2.5vw, 2rem);
            border-radius: 60px;
            font-weight: 700;
            font-size: clamp(0.7rem, 1.8vh, 0.85rem);
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            flex-shrink: 0;
        }
        .btn-outline:hover {
            background: #FF6B6B;
            color: #0F0E17;
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 107, 107, 0.2);
        }

        .quick-link {
            color: #FF6B6B;
            text-decoration: none;
            font-size: clamp(0.65rem, 1.6vh, 0.8rem);
            font-weight: 600;
            transition: color 0.2s;
            padding: 2px 0;
            white-space: nowrap;
        }
        .quick-link:hover { color: #FFD93D; text-decoration: underline; }

        .quick-divider {
            color: rgba(255, 255, 255, 0.15);
            font-size: clamp(0.6rem, 1.4vh, 0.75rem);
        }

        .social-icon {
            width: clamp(32px, 5vw, 40px);
            height: clamp(32px, 5vw, 40px);
            background: rgba(255, 255, 255, 0.06);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 60px;
            transition: all 0.3s;
            color: #FF6B6B;
            border: 1px solid rgba(255, 107, 107, 0.15);
            text-decoration: none;
            font-size: clamp(0.8rem, 1.8vh, 1rem);
        }
        .social-icon:hover {
            background: #FF6B6B;
            color: #0F0E17;
            transform: translateY(-3px);
        }

        .main-container {
            width: 100%;
            max-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .error-icon {
            font-size: clamp(3rem, 6vh, 4.5rem);
            color: #FF6B6B;
            opacity: 0.5;
            margin-bottom: 0.5rem;
        }

        /* Responsive */
        @media (max-height: 700px) {
            .error-card { padding: 1.2rem 1.5rem; transform: scale(0.95); transform-origin: center; }
            .error-number { font-size: 70px; }
            .error-title { font-size: 1.2rem; }
            .error-text { font-size: 0.8rem; }
            .btn-primary, .btn-outline { padding: 0.5rem 1.2rem; font-size: 0.75rem; }
            .logo-icon { width: 34px; height: 34px; }
            .logo-icon i { font-size: 0.9rem; }
            .logo-text { font-size: 1rem; }
            .floating-icon { display: none; }
        }

        @media (max-height: 600px) {
            .error-card { padding: 0.8rem 1.2rem; transform: scale(0.9); }
            .error-number { font-size: 50px; }
            .error-title { font-size: 1rem; }
            .error-text { font-size: 0.7rem; }
            .btn-primary, .btn-outline { padding: 0.4rem 0.8rem; font-size: 0.65rem; }
            .logo-icon { width: 28px; height: 28px; }
            .logo-icon i { font-size: 0.75rem; }
            .logo-text { font-size: 0.85rem; }
            .logo-sub { font-size: 0.35rem; }
            .toggle-btn { width: 32px; height: 32px; font-size: 0.7rem; }
            .theme-toggle-wrapper { top: 10px; right: 10px; }
            .error-icon { font-size: 2.5rem; }
        }

        @media (max-width: 480px) {
            .error-card { padding: 1.5rem 1.2rem; border-radius: 28px; margin: 0 10px; }
            .error-number { font-size: 65px; }
            .error-title { font-size: 1.2rem; }
            .btn-primary, .btn-outline { font-size: 0.75rem; padding: 0.6rem 1rem; }
            .theme-toggle-wrapper { top: 12px; right: 12px; }
            .toggle-btn { width: 34px; height: 34px; font-size: 0.75rem; }
        }

        @media (max-width: 380px) {
            .error-card { padding: 1rem 0.8rem; border-radius: 24px; }
            .error-number { font-size: 50px; }
            .error-title { font-size: 1rem; }
            .error-text { font-size: 0.7rem; }
            .btn-primary, .btn-outline { font-size: 0.65rem; padding: 0.4rem 0.8rem; }
            .logo-icon { width: 26px; height: 26px; }
            .logo-icon i { font-size: 0.7rem; }
            .logo-text { font-size: 0.8rem; }
            .toggle-btn { width: 28px; height: 28px; font-size: 0.65rem; }
            .error-icon { font-size: 2rem; }
            .social-icon { width: 28px; height: 28px; font-size: 0.7rem; }
            .quick-link { font-size: 0.6rem; }
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(6px, 1.5vh, 16px);
            justify-content: center;
            margin-top: clamp(12px, 3vh, 24px);
        }

        .quick-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(4px, 1vw, 8px) clamp(8px, 1.5vw, 16px);
            margin-top: clamp(12px, 2vh, 20px);
            padding-top: clamp(12px, 2vh, 20px);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .mt-responsive {
            margin-top: clamp(8px, 2vh, 24px);
        }

        .gap-responsive {
            gap: clamp(6px, 1.5vh, 16px);
        }

        [dir="rtl"] .theme-toggle-wrapper { right: auto; left: 16px; }
        [dir="rtl"] .fa-arrow-right { transform: scaleX(-1); }
        [dir="rtl"] .error-number { background: linear-gradient(135deg, #FFD93D 0%, #FF6B6B 70%); -webkit-background-clip: text; background-clip: text; }

        @media (max-width: 420px) {
            .main-container { padding: 12px; }
        }

        @media (max-width: 360px) {
            .main-container { padding: 8px; }
        }
    </style>
</head>
<body>

    <!-- Floating Icons -->
    <div class="floating-icon"><i class="fas fa-mobile-alt"></i></div>
    <div class="floating-icon"><i class="fas fa-headphones"></i></div>
    <div class="floating-icon"><i class="fas fa-bolt"></i></div>

    <!-- Theme Toggles -->
    <div class="theme-toggle-wrapper">
        <button id="rtl-toggle" class="toggle-btn" title="RTL">⇄</button>
        <button id="theme-toggle" class="toggle-btn" title="Theme"><i class="fas fa-moon"></i><i class="fas fa-sun hidden"></i></button>
    </div>

    <!-- 404 Card - Centered -->
    <div class="main-container">
        <div class="error-card animate-fade-in">

            <!-- Logo -->
            <div class="logo-wrapper">
                <div class="logo-icon"><i class="fas fa-mobile-alt"></i></div>
                <div>
                    <span class="logo-text">Phone<span class="highlight">Hub</span></span>
                    <span class="logo-sub">Mobile &amp; Accessories</span>
                </div>
            </div>

            <!-- Error Icon -->
            <div class="error-icon floating">
                <i class="fas fa-mobile-alt"></i>
            </div>

            <!-- 404 Number -->
            <div class="error-number">404</div>

            <!-- Error Title -->
            <h1 class="error-title">Page Not Found</h1>

            <!-- Error Message -->
            <p class="error-text">
                Oops! The page you're looking for seems to have wandered off. It might have been moved, deleted, or never existed. Let's get you back on track.
            </p>

            <!-- Action Buttons -->
            <div class="btn-group">
                <a href="index.html" class="btn-primary">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <a href="contact.html" class="btn-outline">
                    <i class="fas fa-headset"></i> Contact Support
                </a>
            </div>

            <!-- Quick Links -->
            <div class="quick-links">
                <a href="about.html" class="quick-link">About Us</a>
                <span class="quick-divider">|</span>
                <a href="services.html" class="quick-link">Services</a>
                <span class="quick-divider">|</span>
                <a href="smartphones.html" class="quick-link">Smartphones</a>
                <span class="quick-divider">|</span>
                <a href="accessories.html" class="quick-link">Accessories</a>
                <span class="quick-divider">|</span>
                <a href="offers.html" class="quick-link">Offers</a>
                <span class="quick-divider">|</span>
                <a href="contact.html" class="quick-link">Contact</a>
            </div>

            <!-- Social Icons -->
            <div class="flex justify-center gap-2 mt-4">
                <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-youtube"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
            </div>

        </div>
    </div>

    <script>
        (function() {
            // ---------- THEME TOGGLE ----------
            const themeToggle = document.getElementById('theme-toggle');

            function setTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }

                const icon = themeToggle?.querySelector('i');
                if (icon) {
                    icon.classList.remove('fa-sun', 'fa-moon');
                    icon.classList.add(isDark ? 'fa-moon' : 'fa-sun');
                }

                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                setTheme(true);
            } else if (savedTheme === 'light') {
                setTheme(false);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme(true);
            } else {
                setTheme(false);
            }

            if (themeToggle) {
                themeToggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    setTheme(!document.documentElement.classList.contains('dark'));
                });
            }

            // ---------- RTL TOGGLE ----------
            const rtlBtn = document.getElementById('rtl-toggle');

            function setRTL(isRTL) {
                if (isRTL) {
                    document.documentElement.dir = 'rtl';
                    document.documentElement.lang = 'ar';
                    localStorage.setItem('dir', 'rtl');
                } else {
                    document.documentElement.dir = 'ltr';
                    document.documentElement.lang = 'en';
                    localStorage.setItem('dir', 'ltr');
                }
            }

            const savedDir = localStorage.getItem('dir');
            savedDir === 'rtl' ? setRTL(true) : setRTL(false);

            if (rtlBtn) {
                rtlBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    setRTL(document.documentElement.dir !== 'rtl');
                });
            }

            // ---------- KEYBOARD SHORTCUTS ----------
            document.addEventListener('keydown', (e) => {
                // Don't trigger if user is typing in an input or textarea
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                switch(e.key.toLowerCase()) {
                    case 'h':
                        window.location.href = 'index.html';
                        break;
                    case 'c':
                        window.location.href = 'contact.html';
                        break;
                    case 'a':
                        window.location.href = 'about.html';
                        break;
                    case 's':
                        window.location.href = 'services.html';
                        break;
                }
            });

            // Console Easter Egg
            console.log('%c📱 PhoneHub Mobile Store', 'font-size:24px; font-weight:bold; color:#FF6B6B;');
            console.log('%c404 · Page Not Found', 'font-size:16px; color:#FFD93D;');
            console.log('%cLooks like you took a wrong turn! Let us guide you back.', 'font-size:12px; color:rgba(255,255,255,0.5);');
            console.log('%c💡 Keyboard shortcuts: H (Home) · C (Contact) · A (About) · S (Services)', 'font-size:11px; color:rgba(255,255,255,0.3);');
        })();
    </script>

</body>
</html>
